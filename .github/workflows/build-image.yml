name: Build app image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-app-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
          echo "version=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=long
          flavor: |
            suffix=-${{ matrix.arch }},onlatest=true
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.app.local
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AETHER_BUILD_VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,scope=app-${{ matrix.arch }},mode=max

  publish:
    name: Publish multi-platform image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ needs.build.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=long
      - name: Merge architecture manifests
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] || args+=(--tag "${tag}")
          done <<< "${TAGS}"
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}"

  deploy:
    name: Update server
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref_name == github.event.repository.default_branch
    env:
      AETHER_DEPLOY_HOST: ${{ secrets.AETHER_DEPLOY_HOST }}
      AETHER_DEPLOY_USER: ${{ secrets.AETHER_DEPLOY_USER }}
      AETHER_DEPLOY_PORT: ${{ secrets.AETHER_DEPLOY_PORT }}
      AETHER_DEPLOY_SSH_KEY: ${{ secrets.AETHER_DEPLOY_SSH_KEY }}
      AETHER_DEPLOY_KNOWN_HOSTS: ${{ secrets.AETHER_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check deployment secrets
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${AETHER_DEPLOY_HOST}" ] && [ -n "${AETHER_DEPLOY_USER}" ] && [ -n "${AETHER_DEPLOY_SSH_KEY}" ] && [ -n "${AETHER_DEPLOY_KNOWN_HOSTS}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Deployment skipped: configure AETHER_DEPLOY_HOST, USER, SSH_KEY and KNOWN_HOSTS secrets."
          fi
      - name: Deploy over SSH
        if: steps.check.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${AETHER_DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${AETHER_DEPLOY_SSH_KEY}" > ~/.ssh/aether_deploy_key
          chmod 600 ~/.ssh/aether_deploy_key
          printf '%s\n' "${AETHER_DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/aether_deploy_key -p "${port}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${AETHER_DEPLOY_USER}@${AETHER_DEPLOY_HOST}" "deploy ${GITHUB_SHA}"
